<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">

  <sc-if value="{{ isCash }}" hint-placeholder-val="{{ true }}">
    <svg width="100%" height="100%" viewBox="0 0 100 100" role="img" aria-label="Cash App">
      <rect width="100" height="100" rx="24" fill="#00D64F"></rect>
      <text x="50" y="53" text-anchor="middle" dominant-baseline="central" font-family="'Source Sans 3', Arial, sans-serif" font-weight="700" font-size="56" fill="#ffffff">$</text>
    </svg>
  </sc-if>

  <sc-if value="{{ isVenmo }}" hint-placeholder-val="{{ false }}">
    <svg width="100%" height="100%" viewBox="0 0 100 100" role="img" aria-label="Venmo">
      <rect width="100" height="100" rx="24" fill="#008CFF"></rect>
      <text x="50" y="55" text-anchor="middle" dominant-baseline="central" font-family="'Source Sans 3', Arial, sans-serif" font-weight="700" font-size="25" letter-spacing="-0.5" fill="#ffffff">venmo</text>
    </svg>
  </sc-if>

  <sc-if value="{{ isPaypal }}" hint-placeholder-val="{{ false }}">
    <svg width="100%" height="100%" viewBox="0 0 100 100" role="img" aria-label="PayPal">
      <rect width="100" height="100" rx="24" fill="#ffffff" stroke="#e7e0d2" stroke-width="2"></rect>
      <text x="40" y="52" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="60" fill="#003087">P</text>
      <text x="58" y="60" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="60" fill="#0091DE">P</text>
    </svg>
  </sc-if>

  <sc-if value="{{ isSquare }}" hint-placeholder-val="{{ false }}">
    <svg width="100%" height="100%" viewBox="0 0 100 100" role="img" aria-label="Square">
      <rect width="100" height="100" rx="24" fill="#000000"></rect>
      <rect x="29" y="29" width="42" height="42" rx="9" fill="none" stroke="#ffffff" stroke-width="9"></rect>
    </svg>
  </sc-if>

  <sc-if value="{{ isCard }}" hint-placeholder-val="{{ false }}">
    <svg width="100%" height="100%" viewBox="0 0 100 100" role="img" aria-label="Credit card">
      <rect x="10" y="24" width="80" height="52" rx="11" fill="#3d7a45"></rect>
      <rect x="10" y="37" width="80" height="12" fill="#2f5f36"></rect>
      <rect x="20" y="58" width="22" height="11" rx="3" fill="#e6d3ad"></rect>
    </svg>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 96, &quot;height&quot;: 96 },
  &quot;method&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;cashapp&quot;, &quot;venmo&quot;, &quot;paypal&quot;, &quot;square&quot;, &quot;card&quot;], &quot;default&quot;: &quot;cashapp&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const m = this.props.method ?? 'cashapp';
    return {
      isCash: m === 'cashapp',
      isVenmo: m === 'venmo',
      isPaypal: m === 'paypal',
      isSquare: m === 'square',
      isCard: m === 'card',
    };
  }
}
</script>
</body>
</html>
