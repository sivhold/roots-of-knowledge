<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" font-family="system-ui, -apple-system, sans-serif">
  <title>ROKT Home Page Mockup</title>
  <desc>Proposed home page layout: header, hero with logo and CTAs, mission section, how we work, three audience cards, footer.</desc>

  <!-- Page background -->
  <rect width="900" height="1400" fill="#C58F41"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="70" fill="#6B4A2B"/>
  <rect x="30" y="18" width="36" height="36" rx="4" fill="#FDF6EC"/>
  <text x="74" y="42" fill="#FDF6EC" font-size="13" font-weight="600" letter-spacing="1">ROOTS OF KNOWLEDGE TUTORING</text>
  <g fill="#FDF6EC" font-size="12">
    <text x="500" y="42">About</text>
    <text x="554" y="42">Programs</text>
    <text x="623" y="42">Enroll</text>
    <text x="668" y="42">Volunteer</text>
    <text x="740" y="42">Impact</text>
    <text x="796" y="42">Donate</text>
  </g>

  <!-- Hero section -->
  <g transform="translate(0, 110)">
    <!-- Logo placeholder -->
    <rect x="370" y="0" width="160" height="160" rx="10" fill="#FDF6EC" stroke="#6B4A2B" stroke-width="2"/>
    <text x="450" y="80" text-anchor="middle" fill="#6B4A2B" font-size="11" font-weight="600">[ ROKT LOGO ]</text>
    <text x="450" y="98" text-anchor="middle" fill="#6B4A2B" font-size="10" opacity="0.7">(from Media Library)</text>

    <!-- Headline -->
    <text x="450" y="210" text-anchor="middle" fill="#FDF6EC" font-size="36" font-style="italic" font-weight="700" font-family="Georgia, serif">Tutoring Sprinkled With Love</text>

    <!-- Subheadline -->
    <text x="450" y="248" text-anchor="middle" fill="#FDF6EC" font-size="15" opacity="0.95">Free, culturally responsive reading instruction for children in</text>
    <text x="450" y="268" text-anchor="middle" fill="#FDF6EC" font-size="15" opacity="0.95">underserved communities across Los Angeles County.</text>

    <!-- CTA buttons -->
    <g transform="translate(290, 300)">
      <rect x="0" y="0" width="150" height="44" rx="6" fill="#FDF6EC"/>
      <text x="75" y="28" text-anchor="middle" fill="#6B4A2B" font-size="14" font-weight="600">Get Help</text>
    </g>
    <g transform="translate(460, 300)">
      <rect x="0" y="0" width="170" height="44" rx="6" fill="none" stroke="#FDF6EC" stroke-width="2"/>
      <text x="85" y="28" text-anchor="middle" fill="#FDF6EC" font-size="14" font-weight="600">Support Our Work</text>
    </g>
  </g>

  <!-- Mission section (subtle tinted band) -->
  <g transform="translate(0, 540)">
    <rect x="0" y="0" width="900" height="200" fill="#FDF6EC" opacity="0.07"/>
    <text x="450" y="48" text-anchor="middle" fill="#FDF6EC" font-size="24" font-weight="600">Our Mission</text>
    <text x="450" y="92" text-anchor="middle" fill="#FDF6EC" font-size="14">At Roots of Knowledge Tutoring, we believe every child deserves to read with</text>
    <text x="450" y="112" text-anchor="middle" fill="#FDF6EC" font-size="14">confidence — and to see themselves reflected in what they read. We provide free,</text>
    <text x="450" y="132" text-anchor="middle" fill="#FDF6EC" font-size="14">high-quality reading tutoring to children in grades K–5.</text>
    <text x="450" y="166" text-anchor="middle" fill="#FDF6EC" font-size="14">We close literacy gaps. We strengthen academic confidence. We empower families.</text>
  </g>

  <!-- How We Work section -->
  <g transform="translate(0, 760)">
    <text x="450" y="48" text-anchor="middle" fill="#FDF6EC" font-size="24" font-weight="600">How We Work</text>
    <text x="450" y="92" text-anchor="middle" fill="#FDF6EC" font-size="14">Our tutoring is offered both <tspan font-weight="600">in person</tspan> — at trusted community centers,</text>
    <text x="450" y="112" text-anchor="middle" fill="#FDF6EC" font-size="14">churches, and libraries near you — and <tspan font-weight="600">virtually</tspan>, so families can choose</text>
    <text x="450" y="132" text-anchor="middle" fill="#FDF6EC" font-size="14">what fits best. Small groups and one-on-one. Focused attention from tutors who care.</text>
  </g>

  <!-- Be Part of It section (subtle tinted band) -->
  <g transform="translate(0, 920)">
    <rect x="0" y="0" width="900" height="260" fill="#FDF6EC" opacity="0.07"/>
    <text x="450" y="50" text-anchor="middle" fill="#FDF6EC" font-size="24" font-weight="600">Be Part of It</text>

    <!-- Card 1 -->
    <g transform="translate(90, 90)">
      <rect x="0" y="0" width="220" height="130" rx="8" fill="#FDF6EC" opacity="0.13"/>
      <text x="110" y="58" text-anchor="middle" fill="#FDF6EC" font-size="15" font-weight="600">Get Help for</text>
      <text x="110" y="80" text-anchor="middle" fill="#FDF6EC" font-size="15" font-weight="600">Your Child</text>
      <text x="110" y="110" text-anchor="middle" fill="#FDF6EC" font-size="13" opacity="0.85">Enroll →</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(340, 90)">
      <rect x="0" y="0" width="220" height="130" rx="8" fill="#FDF6EC" opacity="0.13"/>
      <text x="110" y="58" text-anchor="middle" fill="#FDF6EC" font-size="15" font-weight="600">Become</text>
      <text x="110" y="80" text-anchor="middle" fill="#FDF6EC" font-size="15" font-weight="600">a Tutor</text>
      <text x="110" y="110" text-anchor="middle" fill="#FDF6EC" font-size="13" opacity="0.85">Volunteer →</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(590, 90)">
      <rect x="0" y="0" width="220" height="130" rx="8" fill="#FDF6EC" opacity="0.13"/>
      <text x="110" y="58" text-anchor="middle" fill="#FDF6EC" font-size="15" font-weight="600">Support</text>
      <text x="110" y="80" text-anchor="middle" fill="#FDF6EC" font-size="15" font-weight="600">Our Work</text>
      <text x="110" y="110" text-anchor="middle" fill="#FDF6EC" font-size="13" opacity="0.85">Donate →</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(0, 1340)">
    <rect x="0" y="0" width="900" height="60" fill="#6B4A2B"/>
    <text x="450" y="36" text-anchor="middle" fill="#FDF6EC" font-size="12" opacity="0.9">© 2026 Roots of Knowledge Tutoring  ●  Contact: rootsofknowledgetutor@gmail.com  ●  FB · TW</text>
  </g>
</svg>
